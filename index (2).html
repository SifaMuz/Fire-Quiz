<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Quiz – Fire Safety</title>
<style>
:root{
  --bg:#fff7ef; --bg2:#ffe9d6; --card:#ffffff; --ink:#2a1a12; --muted:#7a6558;
  --accent:#ff5a1f; --accent2:#ffb020; --accent-ink:#ffffff; --line:#f1d9c6;
  --ok:#17a367; --shadow:0 10px 30px rgba(120,50,10,.12); --font-scale:1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120d1f; --bg2:#1d1233; --card:#1f1832; --ink:#fff3ea; --muted:#b9a8c9;
    --accent:#ff6a2b; --accent2:#ffc247; --line:#33284d; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#120d1f; --bg2:#1d1233; --card:#1f1832; --ink:#fff3ea; --muted:#b9a8c9;
  --accent:#ff6a2b; --accent2:#ffc247; --line:#33284d; --shadow:0 10px 30px rgba(0,0,0,.45);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;color:var(--ink);background:var(--bg);
  font-family:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  background-image:radial-gradient(900px 500px at 85% -10%,var(--bg2),transparent 70%),
                   radial-gradient(700px 400px at -10% 110%,var(--bg2),transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- shared ---------- */
.wrap{max-width:1500px;margin:0 auto;padding:18px clamp(14px,3vw,36px) 40px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 1.6s infinite}
.dot.closed{background:#d33;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.qcard{
  background:linear-gradient(135deg,var(--accent),#e2271b 60%,#b3123c);color:#fff;border-radius:26px;
  padding:clamp(18px,2.6vw,34px);box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.qcard::after{content:"🔥";position:absolute;right:-10px;bottom:-34px;font-size:150px;opacity:.14;transform:rotate(-12deg)}
.qcard small{opacity:.85;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
.qcard h1{margin:.35em 0 0;font-size:calc(clamp(1.15rem,2.3vw,2rem)*var(--font-scale));line-height:1.35;font-weight:700}
.qcard h1 b{background:rgba(255,255,255,.22);padding:0 .35em;border-radius:8px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;
  box-shadow:0 6px 16px rgba(255,90,31,.35);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:11px}
.notice{margin:14px 0;padding:14px 18px;border-radius:16px;background:var(--card);border:1px dashed var(--accent);color:var(--ink)}

/* ---------- tips ---------- */
.tips{margin-top:18px;background:var(--card);border:2px solid var(--ok);border-radius:22px;padding:18px 22px;box-shadow:var(--shadow);animation:pop .5s}
.tips h3{margin:0 0 10px;color:var(--ok);font-size:calc(1.15rem*var(--font-scale))}
.tips ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:calc(1rem*var(--font-scale))}
.tips li b{color:var(--accent)}

/* ---------- presenter ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.meter{display:flex;align-items:center;gap:14px;margin:18px 2px 8px}
.meter .bar{flex:1;height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.meter .num{font-weight:800;font-size:1.4rem;min-width:90px;text-align:right}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;margin-top:10px}
.ans{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;animation:pop .55s cubic-bezier(.2,1.3,.4,1);cursor:zoom-in;position:relative}
.ans.fresh{outline:3px solid var(--accent2)}
@keyframes pop{0%{transform:translateY(24px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
.who{display:flex;align-items:center;gap:12px}
.dp{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none;
  background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent2)}
.who .nm{font-weight:700;font-size:calc(1.05rem*var(--font-scale));line-height:1.2}
.who .tm{font-size:.75rem;color:var(--muted)}
.ans p{margin:0;font-size:calc(1rem*var(--font-scale));line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ans .x{position:absolute;top:8px;right:10px;border:0;background:transparent;color:var(--muted);font-size:1rem;opacity:0;transition:opacity .15s}
.ans:hover .x{opacity:1}
.empty{grid-column:1/-1;text-align:center;padding:46px 10px;color:var(--muted);font-size:1.1rem}
.empty .big{font-size:56px;display:block;animation:bob 2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-10px)}}
.waiting{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.waiting .chip{padding:5px 12px;border-radius:99px;background:var(--card);border:1px dashed var(--line);color:var(--muted);font-size:.82rem}
.waiting b{font-size:.85rem;color:var(--muted);margin-right:4px}
.spot{position:fixed;inset:0;z-index:50;background:rgba(10,5,20,.78);display:grid;place-items:center;padding:24px;backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.spot .ans{max-width:980px;width:100%;cursor:zoom-out;animation:pop .35s;padding:30px 36px}
.spot .dp{width:92px;height:92px;font-size:54px}
.spot .nm{font-size:2rem!important}
.spot p{font-size:calc(1.6rem*var(--font-scale))!important}
.float{position:fixed;bottom:-40px;font-size:34px;pointer-events:none;z-index:40;animation:rise 2.6s ease-out forwards}
@keyframes rise{to{transform:translateY(-70vh) rotate(25deg);opacity:0}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,5,20,.7);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--card);border-radius:22px;padding:22px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.modal textarea{width:100%;height:240px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;font:inherit}

/* ---------- student ---------- */
.stu{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-top:16px;animation:pop .45s}
.panel h2{margin:0 0 12px;font-size:1.1rem}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.85rem;margin-right:8px}
label.f{display:block;font-weight:600;margin:12px 0 6px;font-size:.9rem;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:14px;border:2px solid transparent;background:var(--bg);font-size:1.5rem;padding:0;transition:transform .12s}
.emojis button:hover{transform:scale(1.12)}
.emojis button.sel{border-color:var(--accent);background:var(--bg2);transform:scale(1.12)}
.preview{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.counter{text-align:right;font-size:.8rem;color:var(--muted);margin-top:4px}
.done{text-align:center}
.done .dp{width:96px;height:96px;font-size:56px;margin:6px auto 10px}
.err{color:#d33;font-size:.9rem;margin-top:8px}
@media (max-width:420px){.emojis{grid-template-columns:repeat(6,1fr)}}

.qrov{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;text-align:center;padding:20px;cursor:zoom-out}
.qrov h1{margin:0 0 6px;color:var(--accent);font-size:clamp(1.6rem,4vw,3rem)}
.qrov p{margin:0 0 18px;color:var(--muted);font-size:clamp(1rem,2vw,1.4rem)}
.qrbox{background:#fff;border-radius:28px;padding:22px;display:inline-block;border:6px solid var(--accent);box-shadow:var(--shadow)}
.qrbox>div{width:min(62vh,80vw,460px);height:min(62vh,80vw,460px)}
.qrbox img,.qrbox canvas{width:100%!important;height:100%!important;image-rendering:pixelated}
.qrov small{display:block;margin-top:16px;color:var(--muted);word-break:break-all}
.conn{font-size:.78rem}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
"use strict";
/* ====================================================================
   CONFIG
   ==================================================================== */
const TOPIC = "fireq-0l3ledi6y1nv";                       // private channel name – change it for a new class
const RELAY = "https://ntfy.sh/" + TOPIC;        // free public relay, no account needed
const QUESTION_PRE = "The fire at The Address Downtown Dubai was caused by an electrical short circuit. If you witnessed a similar fire, what would you do ";
const QUESTION_KEY = "FIRST?";
const QUESTION_POST = " Explain!";
const DEFAULT_EXPECTED = 25;
const MAX_CHARS = 500;
const EMOJIS = ["🦁","🐯","🐼","🦊","🐨","🐸","🐵","🦄","🐙","🦋","🐬","🦅","🐢","🐧","🦉","🐶",
                "😎","🤩","🥳","🤓","😇","🤠","🧠","💡","⚡","🌟","🚀","🎯","🏆","🎨","🎧","⚽",
                "🏀","🎮","🌈","🔥","💎","🍀","🌻","🍕","🦸","🧑‍🚀","🧑‍🚒","👑","🛡️","🧩","📚","🌍"];
const TIPS = [
  ["Stay calm & raise the alarm","– pull the nearest fire alarm / shout “FIRE!” so everyone nearby is warned."],
  ["Get out, stay out","– leave by the nearest safe exit or stairs. <b>Never use the lift.</b> Don’t go back for belongings."],
  ["Protect yourself","– feel doors before opening, close doors behind you, stay low under smoke."],
  ["Don’t fight an electrical fire with water","– only use a suitable extinguisher if trained and the exit is clear."],
  ["Once safe, call <b>997</b> (Civil Defence)","– give the building name, floor and what you saw."],
  ["Go to the assembly point","– and tell staff / responders if anyone is missing."]
];

/* ====================================================================
   HELPERS
   ==================================================================== */
const $ = (sel, root=document) => root.querySelector(sel);
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const k in (props||{})){
    const v = props[k];
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;      // trusted static strings only
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}
function store(k, v){
  try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ return null; }
}
function timeAgo(ts){
  const s = Math.max(0, (Date.now() - ts)/1000);
  if (s < 10) return "just now";
  if (s < 60) return Math.floor(s) + "s ago";
  return Math.floor(s/60) + " min ago";
}
const clean = s => String(s||"").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u200B-\u200F\u202A-\u202E\u2066-\u2069]/g,"").trim();
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

/* ====================================================================
   STATE + TRANSPORT
   ==================================================================== */
const DEFAULT_STATE = {open:true, reveal:false, round:1, roster:[], hidden:[], v:0};
// 🔒 PRESENTER PASSWORD – change this text to your own before sharing the file
const PASSWORD = "Fire2026";
let isTeacher = false;
try { isTeacher = sessionStorage.getItem("lq_teacher") === "1"; } catch(e){}
const wantsTeacher = /teacher/i.test(location.hash);
const myId = store("lq_uid") || (function(){ const i = rid(); store("lq_uid", i); return i; })();
const joinUrl = location.href.split("#")[0].split("?")[0];

let S = Object.assign({}, DEFAULT_STATE);
const answerMap = new Map();     // uid -> answer
const seenMsgs = new Set();
let connected = false;
let view = isTeacher ? "present" : "student";
let studentPreview = false;
let firstLoadDone = false;
let fontScale = 1;
const app = $("#app");

function currentAnswers(){
  return [...answerMap.values()].filter(a => a.round === S.round && !(S.hidden||[]).includes(a.uid)).sort((a,b) => b.ts - a.ts);
}
function myAnswer(){ const a = answerMap.get(myId); return (a && a.round === S.round) ? a : null; }

function handle(msg, live){
  if (!msg || typeof msg !== "object") return;
  if (msg.t === "state"){
    if ((msg.v||0) >= (S.v||0)){
      S = Object.assign({}, DEFAULT_STATE, {
        open: msg.open !== false, reveal: !!msg.reveal, round: +msg.round || 1,
        roster: Array.isArray(msg.roster) ? msg.roster.map(String).slice(0,200) : [],
        hidden: Array.isArray(msg.hidden) ? msg.hidden.map(String) : [], v: msg.v||0 });
    }
  } else if (msg.t === "ans" && msg.uid){
    const prev = answerMap.get(msg.uid);
    const rnd = +msg.round || 1;
    const nm = clean(msg.name).toLowerCase();
    // ONE ANSWER ONLY: the first answer in a round is kept, later ones are ignored
    const sameRound = prev && prev.round === rnd;
    const nameTaken = [...answerMap.values()].some(x => x.uid !== String(msg.uid) && x.round === rnd && x.name.toLowerCase() === nm);
    if (nameTaken) return;
    if (!prev || (!sameRound && rnd > prev.round)){
      const a = { uid:String(msg.uid), name:clean(msg.name).slice(0,60), emoji:String(msg.emoji||"🙂").slice(0,12),
                  text:clean(msg.text).slice(0,MAX_CHARS), round:+msg.round||1, ts:+msg.ts||Date.now() };
      answerMap.set(a.uid, a);
      if (live && isTeacher && view==="present" && a.round===S.round) floatEmoji(a.emoji);
    }
  }
}

async function send(obj){
  try {
    const r = await fetch(RELAY, {method:"POST", body: JSON.stringify(obj)});
    return r.ok;
  } catch(e){ return false; }
}

function connect(){
  let es;
  try { es = new EventSource(RELAY + "/sse?since=all"); } catch(e){ return; }
  es.onopen = () => { connected = true; softRender(); };
  es.onerror = () => { connected = false; softRender(); };
  es.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch(e){ return; }
    if (m.event !== "message" || !m.message) return;
    if (seenMsgs.has(m.id)) return; seenMsgs.add(m.id);
    let body; try { body = JSON.parse(m.message); } catch(e){ return; }
    handle(body, firstLoadDone);
    scheduleRender();
  };
  setTimeout(() => { firstLoadDone = true; }, 3500);   // don't float-emoji for replayed history
}

let rt = null;
function scheduleRender(){ if (rt) return; rt = setTimeout(() => { rt = null; softRender(); }, 150); }
function softRender(){
  const a = document.activeElement;
  if (view === "student" && a && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName) && app.contains(a)) { updateConnPill(); return; }
  render();
}
function updateConnPill(){ document.querySelectorAll(".conn").forEach(e => { e.textContent = connected ? "● Live" : "○ Connecting…"; }); }

async function saveState(patch){
  S = Object.assign({}, S, patch, {v: Date.now()});
  render();
  const ok = await send(Object.assign({t:"state"}, S));
  if (!ok) alert("Could not reach the relay – check the internet connection.");
}

/* ====================================================================
   RENDER
   ==================================================================== */
function render(){ view === "present" ? renderPresenter() : renderStudent(); }

function questionCard(){
  return h("div",{class:"qcard"},
    h("small",{text:"🔥 Live Question"}),
    h("h1",{}, QUESTION_PRE, h("b",{text:QUESTION_KEY}), QUESTION_POST));
}
function tipsCard(){
  const ol = h("ol");
  TIPS.forEach(([t,d]) => ol.append(h("li",{html:"<b>"+t+"</b> "+d})));
  return h("div",{class:"tips"}, h("h3",{text:"✅ Safety checklist – what to do first"}), ol);
}
function connPill(){ return h("span",{class:"pill conn",text:connected?"● Live":"○ Connecting…"}); }

/* ---------------- presenter ---------------- */
function renderPresenter(){
  const list = currentAnswers();
  const expected = S.roster.length ? S.roster.length : DEFAULT_EXPECTED;
  const answered = [...answerMap.values()].filter(a => a.round === S.round).length;

  const controls = h("div",{class:"controls"},
    h("button",{class:"btn sm", onclick:showQR, text:"📱 Show QR"}),
    h("button",{class:"btn sm "+(S.open?"ghost":""), onclick:()=>saveState({open:!S.open}), text:S.open?"⏸ Close answers":"▶ Re-open answers"}),
    h("button",{class:"btn sm ghost", onclick:()=>saveState({reveal:!S.reveal}), text:S.reveal?"🙈 Hide checklist":"✅ Show checklist"}),
    h("button",{class:"btn sm ghost", onclick:()=>{ if(confirm("Start a fresh round? The wall will be cleared.")) saveState({round:S.round+1, open:true, reveal:false, hidden:[]}); }, text:"🔄 New round"}),
    h("button",{class:"btn sm ghost", onclick:rosterModal, text:"👥 Class list"}),
    h("button",{class:"btn sm ghost", onclick:()=>{ fontScale=Math.max(.7,fontScale-.1); document.documentElement.style.setProperty("--font-scale",fontScale); }, text:"A−"}),
    h("button",{class:"btn sm ghost", onclick:()=>{ fontScale=Math.min(1.8,fontScale+.1); document.documentElement.style.setProperty("--font-scale",fontScale); }, text:"A+"}),
    h("button",{class:"btn sm ghost", onclick:()=>{ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); }, text:"⛶"}),
    h("button",{class:"btn sm ghost", onclick:()=>{ studentPreview=true; view="student"; render(); }, text:"📱 Student view"}),
    h("button",{class:"btn sm ghost", onclick:lockPresenter, text:"🔒 Lock"})
  );
  const meter = h("div",{class:"meter"},
    h("div",{class:"bar"}, h("i",{style:"width:"+Math.min(100,answered/expected*100)+"%"})),
    h("div",{class:"num",text:answered+" / "+expected}));

  const wall = h("div",{class:"wall"});
  if (!list.length){
    wall.append(h("div",{class:"empty"}, h("span",{class:"big",text:"📱"}), "Waiting for the first answer…", h("br"), h("small",{text:"Students: scan the QR, pick your name & emoji, and answer."})));
  } else list.forEach(a => wall.append(answerCard(a, true)));

  const pending = S.roster.filter(n => ![...answerMap.values()].some(a => a.round===S.round && a.name===n));
  const waiting = pending.length ? h("div",{class:"waiting"}, h("b",{text:"⏳ Still thinking:"}), pending.map(n => h("span",{class:"chip",text:n}))) : null;

  app.replaceChildren(h("div",{class:"wrap"},
    h("div",{class:"topbar"},
      h("div",{class:"brand",text:"🔥 LIVE QUIZ  ·  Round "+S.round}),
      h("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},
        connPill(),
        h("span",{class:"pill"}, h("span",{class:"dot"+(S.open?"":" closed")}), S.open?"Answers open":"Answers closed"),
        controls)),
    questionCard(), meter, S.reveal ? tipsCard() : null, wall, waiting));
}

function answerCard(a, withHide){
  const card = h("div",{class:"ans"+((Date.now()-a.ts<8000)?" fresh":""), "data-ts":a.ts, onclick:()=>spotlight(a)},
    h("div",{class:"who"},
      h("div",{class:"dp",text:a.emoji||"🙂"}),
      h("div",{}, h("div",{class:"nm",text:a.name}), h("div",{class:"tm",text:timeAgo(a.ts)}))),
    h("p",{text:a.text}));
  if (withHide) card.append(h("button",{class:"x",title:"Hide this answer",onclick:e=>{e.stopPropagation(); saveState({hidden:[...S.hidden, a.uid]});},text:"✕"}));
  return card;
}
setInterval(() => document.querySelectorAll(".ans[data-ts] .tm").forEach(el => { el.textContent = timeAgo(+el.closest(".ans").dataset.ts); }), 15000);

function spotlight(a){
  const o = h("div",{class:"spot",onclick:()=>o.remove()}, answerCard(a,false));
  o.querySelector(".ans").classList.remove("fresh");
  document.body.append(o);
  const esc = e => { if(e.key==="Escape"){ o.remove(); document.removeEventListener("keydown",esc);} };
  document.addEventListener("keydown",esc);
}
function floatEmoji(e){
  const n = h("div",{class:"float",text:e||"🔥",style:"left:"+(8+Math.random()*84)+"%"});
  document.body.append(n); setTimeout(()=>n.remove(),2800);
}
function showQR(){
  const box = h("div");
  const o = h("div",{class:"qrov",onclick:()=>o.remove()},
    h("div",{}, h("h1",{text:"🔥 Scan to join the quiz"}), h("p",{text:"Open your phone camera → pick your name & emoji → answer!"}),
      h("div",{class:"qrbox"}, box), h("small",{text:joinUrl+"   ·   click anywhere to close"})));
  document.body.append(o);
  try { new QRCode(box, {text: joinUrl, width:512, height:512, colorDark:"#000", colorLight:"#fff", correctLevel: QRCode.CorrectLevel.M}); }
  catch(e){ box.textContent = "QR library could not load – share this link: " + joinUrl; }
}
function rosterModal(){
  const ta = h("textarea",{placeholder:"One registered name per line, exactly as on the school register"});
  ta.value = S.roster.join("\n");
  const m = h("div",{class:"modal"},
    h("div",{class:"box"},
      h("h2",{text:"👥 Class list (registered names)"}),
      h("p",{style:"color:var(--muted);margin:0 0 10px;font-size:.9rem",text:"Students pick their name from this list, so every card shows the school-registered name. Leave empty to let students type their own."}),
      ta,
      h("div",{style:"display:flex;gap:8px;justify-content:flex-end;margin-top:12px"},
        h("button",{class:"btn ghost sm",onclick:()=>m.remove(),text:"Cancel"}),
        h("button",{class:"btn sm",onclick:()=>{
          const names = [...new Set(ta.value.split("\n").map(clean).filter(Boolean))].slice(0,200);
          saveState({roster:names}); m.remove();
        },text:"Save list"}))));
  document.body.append(m);
}

/* ---------------- password ---------------- */
function lockPresenter(){
  try { sessionStorage.removeItem("lq_teacher"); } catch(e){}
  isTeacher = false; studentPreview = false; view = "student"; render();
}
function passwordModal(){
  const inp = h("input",{class:"inp",type:"password",placeholder:"Presenter password",autocomplete:"off"});
  const err = h("div",{class:"err",text:""});
  function tryLogin(){
    if (inp.value === PASSWORD){
      try { sessionStorage.setItem("lq_teacher","1"); } catch(e){}
      isTeacher = true; view = "present"; studentPreview = false; m.remove(); render();
    } else { err.textContent = "❌ Wrong password"; inp.value = ""; inp.focus(); }
  }
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
  const m = h("div",{class:"modal"},
    h("div",{class:"box"},
      h("h2",{text:"🔒 Presenter login"}),
      h("p",{style:"color:var(--muted);margin:0 0 12px;font-size:.9rem",text:"Only the teacher can open the presenter screen."}),
      inp, err,
      h("div",{style:"display:flex;gap:8px;justify-content:flex-end;margin-top:12px"},
        h("button",{class:"btn ghost sm",onclick:()=>m.remove(),text:"Cancel"}),
        h("button",{class:"btn sm",onclick:tryLogin,text:"Open presenter"}))));
  document.body.append(m);
  setTimeout(() => inp.focus(), 50);
}

/* ---------------- student ---------------- */
let profile = store("lq_profile");     // {name, emoji} once the student has joined
let draft = { name:(profile&&profile.name)||"", emoji:(profile&&profile.emoji)||"", text:"", editing:false, busy:false, err:"" };

function teacherLink(){
  return h("div",{style:"text-align:center;margin-top:26px"},
    h("button",{class:"btn ghost sm",onclick:passwordModal,text:"🔒 Teacher login"}));
}

function renderStudent(){
  const root = h("div",{class:"stu"});
  if (studentPreview) root.append(h("button",{class:"btn sm ghost",onclick:()=>{studentPreview=false;view="present";render();},text:"← Back to presenter screen"}));
  root.append(h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin:10px 2px 12px"},
    h("div",{class:"brand",text:"🔥 LIVE QUIZ"}), connPill()));

  if (!profile){ renderJoin(root); }
  else { renderAnswer(root); }
  if (S.reveal && profile) root.append(tipsCard());
  if (!studentPreview && !isTeacher) root.append(teacherLink());
  app.replaceChildren(root);
}

/* ---- screen 1: open with name ---- */
function renderJoin(root){
  const roster = S.roster;
  const takenByOthers = new Set([...answerMap.values()].filter(a => a.round===S.round && a.uid!==myId).map(a=>a.name));
  const preview = h("div",{class:"preview"});
  function drawPreview(){
    preview.replaceChildren(h("div",{class:"dp",text:draft.emoji||"🙂"}), h("div",{},
      h("div",{style:"font-weight:700",text:clean(draft.name)||"Your name"}),
      h("div",{style:"color:var(--muted);font-size:.85rem",text:"This is how you’ll appear on the big screen"})));
  }
  const joinBtn = h("button",{class:"btn",style:"width:100%;margin-top:16px;font-size:1.05rem",onclick:join,text:"🚀 Join the quiz"});
  function updateBtn(){ joinBtn.disabled = !(clean(draft.name).length >= 2 && draft.emoji); }
  function join(){
    profile = { name: clean(draft.name).slice(0,60), emoji: draft.emoji };
    store("lq_profile", profile); store("lq_name", profile.name); store("lq_emoji", profile.emoji);
    render();
  }

  const nameField = roster.length
    ? h("select",{class:"inp",onchange:e=>{draft.name=e.target.value; drawPreview(); updateBtn();}},
        h("option",{value:"",text:"— Select your registered name —"}),
        roster.map(n => h("option",{value:n,selected:n===draft.name,disabled:takenByOthers.has(n),text:n+(takenByOthers.has(n)?"  (already joined)":"")})))
    : h("input",{class:"inp",type:"text",maxlength:"60",placeholder:"Type your full name as in the school register",value:draft.name,autocomplete:"name",
        oninput:e=>{draft.name=e.target.value; drawPreview(); updateBtn();}});

  const grid = h("div",{class:"emojis"});
  EMOJIS.forEach(em => {
    const b = h("button",{type:"button",class:em===draft.emoji?"sel":"",text:em,onclick:()=>{
      draft.emoji = em; grid.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x.textContent===em)); drawPreview(); updateBtn(); }});
    grid.append(b);
  });

  root.append(h("div",{class:"panel"},
    h("div",{style:"text-align:center;font-size:48px;line-height:1",text:"👋"}),
    h("h2",{style:"text-align:center;font-size:1.4rem;margin:8px 0 4px",text:"Welcome to the live quiz!"}),
    h("p",{style:"text-align:center;color:var(--muted);margin:0 0 14px",text:"First, tell us who you are."}),
    preview,
    h("label",{class:"f",text:"Your registered name"}), nameField,
    h("label",{class:"f",text:"Choose your emoji picture"}), grid,
    joinBtn));
  drawPreview(); updateBtn();
}

/* ---- screen 2: question + answer ---- */
function renderAnswer(root){
  const mine = myAnswer();
  root.append(h("div",{class:"panel",style:"display:flex;align-items:center;gap:12px;padding:12px 16px;margin-top:0"},
    h("div",{class:"dp",style:"width:44px;height:44px;font-size:24px",text:profile.emoji}),
    h("div",{style:"flex:1;font-weight:700",text:profile.name}),
    h("button",{class:"btn ghost sm",onclick:()=>{ profile=null; store("lq_profile",null); draft.text=""; draft.editing=false; render(); },text:"Not me"})));
  root.append(questionCard());

  if (mine && !draft.editing){
    root.append(h("div",{class:"panel done"},
      h("div",{class:"dp",text:mine.emoji}),
      h("h2",{text:"Answer sent, "+(mine.name.split(" ")[0]||"")+"! 🎉"}),
      h("p",{style:"white-space:pre-wrap;text-align:left;background:var(--bg);padding:14px;border-radius:14px;margin:12px 0",text:mine.text}),
      h("div",{class:"pill",text:"🔒 Answer locked – one answer only"})));
    return;
  }
  if (!S.open && !mine){
    root.append(h("div",{class:"panel done"}, h("div",{style:"font-size:48px",text:"🔒"}), h("h2",{text:"Answers are closed"}), "Look at the main screen!"));
    return;
  }
  const cnt = h("div",{class:"counter",text:draft.text.length+" / "+MAX_CHARS});
  const ta = h("textarea",{class:"inp",maxlength:String(MAX_CHARS),placeholder:"What would you do FIRST? Explain why…",
    oninput:e=>{draft.text=e.target.value; cnt.textContent=draft.text.length+" / "+MAX_CHARS; updateBtn();}});
  ta.value = draft.text;
  const btn = h("button",{class:"btn",style:"width:100%;margin-top:12px;font-size:1.05rem",onclick:submit,text:draft.editing?"💾 Update answer":"🚀 Send my answer"});
  function updateBtn(){ btn.disabled = clean(draft.text).length < 3 || draft.busy; }
  root.append(h("div",{class:"panel"},
    h("h2",{text:"✍️ Your answer"}), ta, cnt, btn, draft.err ? h("div",{class:"err",text:draft.err}) : null));
  updateBtn();
}

async function submit(){
  if (draft.busy) return;
  if (myAnswer()){ render(); return; }                                   // already answered this round
  const taken = [...answerMap.values()].some(a => a.uid !== myId && a.round === S.round && a.name.toLowerCase() === profile.name.toLowerCase());
  if (taken){ draft.err = "This name has already answered. Tap “Not me” and choose your own name."; render(); return; }
  if (!confirm("You can only submit ONE answer and cannot change it. Send now?")) return;
  draft.busy = true; draft.err = "";
  const msg = { t:"ans", uid:myId, name:profile.name, emoji:profile.emoji, text:clean(draft.text).slice(0,MAX_CHARS), round:S.round, ts:Date.now() };
  render();
  const ok = await send(msg);
  if (ok){ handle(msg, false); draft.editing = false; draft.text = ""; }
  else draft.err = "Could not send – check your internet connection and try again.";
  draft.busy = false;
  render();
}

render();
connect();
if (wantsTeacher && !isTeacher) setTimeout(passwordModal, 300);
})();
</script>
</body>
</html>
